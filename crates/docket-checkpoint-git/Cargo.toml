[package]
name = "docket-checkpoint-git"
description = "The git store of restore points: a hidden commit of the workspace per point, made through a private index and kept under a ref of docket's own. git runs as a process behind the GitRun seam; nothing here touches the person's index, branches or stash."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
docket-checkpoint = { workspace = true }
docket-core = { workspace = true }
porter-core = { workspace = true }
prov = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
docket-checkpoint = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }

[lints]
workspace = true
