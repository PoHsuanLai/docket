[package]
name = "docket-planner"
description = "The planner model: the working-set view rendered into a chat request, the catalogue of tools, and the reply read back into a ModelOutput, behind a `Planner` trait, implemented by `PlannerModel` over any porter-client Transport. Portable: no bus, no runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test code: `ScriptedPlanner`, a `Planner` that plays a script. Only dev-dependencies turn it on.
testing = []

[dependencies]
porter-match = { workspace = true }
porter-capability = { workspace = true }
porter-ids = { workspace = true }
agent-loop = { workspace = true }
almanac-core = { workspace = true }
companion-model = { workspace = true }
companion-wire = { workspace = true }
docket-core = { workspace = true }
docket-manifest = { workspace = true }
docket-permissions-core = { workspace = true }
docket-vocab = { workspace = true }
porter-client = { workspace = true }
porter-core = { workspace = true }
porter-infer = { workspace = true }
prov = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
docket-planner = { workspace = true, features = ["testing"] }
docket-fake = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
