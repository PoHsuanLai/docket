[package]
name = "readerd"
description = "The quarantined reader: a separate process that reads untrusted text under a closed task and a schema, with no tools, and answers a typed value. The binary serves Reader1 on the session bus."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "readerd"
path = "src/lib.rs"

[[bin]]
name = "readerd"
path = "src/main.rs"

[dependencies]
docket-core = { workspace = true }
docket-client = { workspace = true, features = ["dbus"] }
docket-dbus = { workspace = true, features = ["inferd"] }
docket-reader = { workspace = true }
prov = { workspace = true }
porter-core = { workspace = true }
porter-infer = { workspace = true }
porter-client = { workspace = true, features = ["dbus"] }
thiserror = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
zbus = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
docket-testbus = { workspace = true }
tempfile = { workspace = true }
docket-client = { workspace = true, features = ["dbus", "in_process"] }
docket-fake = { workspace = true }
porter-fake = { workspace = true }
proptest = { workspace = true }
docket-router = { workspace = true }

[lints]
workspace = true
