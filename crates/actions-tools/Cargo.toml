[package]
name = "actions-tools"
description = "The tools a registry offers to an outside agent, as pure data: tool names, schemas and hints, the arguments read by their declared types, the coarse refusals and the outcome as JSON. Also the one tool list and the one tool-call preparation (`listing`, `prepare`): the MCP edge (actions-mcp) and the host of an external ACP agent (docket-acp) both call them and keep only their transport."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "actions_tools"
path = "src/lib.rs"

[dependencies]
docket-core = { workspace = true }
docket-vocab = { workspace = true }
prov = { workspace = true }
porter-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
toml = { workspace = true }

[lints]
workspace = true
