[package]
name = "docket-dbus"
description = "org.quire.Intents1, IntentProvider1, Confirm1, Companion1 and Reader1 as zbus proxies and skeletons, their introspection, bus names and the error mapping."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
docket-core = { workspace = true }
prov = { workspace = true }
porter-dbus = { workspace = true }
porter-client = { workspace = true, features = ["dbus"], optional = true }
porter-core = { workspace = true, optional = true }
porter-infer = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
zbus = { workspace = true }
thiserror = { workspace = true }

[features]
# `inferd_transport`: the one place a daemon makes its inferd link (intentd, companiond, readerd),
# and the tap on it that a live run turns on (`tap`).
inferd = ["dep:porter-client", "dep:porter-core", "dep:porter-infer", "dep:serde", "dep:serde_json"]

[lints]
workspace = true
