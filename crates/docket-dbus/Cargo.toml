[package]
name = "docket-dbus"
description = "org.quire.Intents1, IntentProvider1, Confirm1, Companion1 and Reader1 as zbus proxies and skeletons, their introspection, bus names and the error mapping."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-match = { workspace = true }
porter-capability = { workspace = true }
docket-core = { workspace = true }
docket-wire = { workspace = true }
docket-manifest = { workspace = true }
docket-vocab = { workspace = true }
prov = { workspace = true }
porter-callers = { workspace = true, features = ["file"] }
porter-dbus = { workspace = true }
inferd-client = { workspace = true, features = ["dbus"], optional = true }
steward-dbus = { workspace = true }
porter-core = { workspace = true }
porter-infer = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
zbus = { workspace = true }
thiserror = { workspace = true }

[features]
# `inferd_transport`: the one place a daemon makes its inferd link (intentd, companiond, readerd),
# and the watch on it that a live run turns on (`watch`; docket-trace is the watcher).
inferd = ["dep:inferd-client", "dep:porter-infer"]
# Callers read from a fixture tree standing for /proc and the unit manager (`Identity::on_fixture`):
# porter reads one only in a test build. Turned on by docket-accept and by tests' dev-dependencies,
# never by a shipped crate (check-boundary.sh checks every shipped package's feature tree).
fixture-callers = ["porter-callers/test-proc-root"]

[lints]
workspace = true

[dev-dependencies]
docket-dbus = { path = ".", features = ["fixture-callers"] }
tempfile = { workspace = true }
