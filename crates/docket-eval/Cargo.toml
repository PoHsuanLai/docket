[package]
name = "docket-eval"
description = "The red-team suite runner: reads the corpus and attack files, plays the cases over docket-fake, and checks an app against the conformance rules. The case format, judgement and scores are in eval-core."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "docket-eval"
path = "src/main.rs"

[dependencies]
action-review = { workspace = true }
docket-fake = { workspace = true }
docket-core = { workspace = true }
docket-wire = { workspace = true }
docket-manifest = { workspace = true, features = ["manifest-file"] }
docket-permissions-core = { workspace = true }
docket-vocab = { workspace = true }
docket-skills = { workspace = true }
docket-skills-disk = { workspace = true }

eval-core = { workspace = true }
docket-router = { workspace = true }
prov = { workspace = true }
porter-core = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
