[package]
name = "docket-context"
description = "What the router remembers and shows: the session record and its state, the handle table, the task table, the write-ahead log, the undo journal, the manifest registry, the labels, the rebuild of a session from its log, and who is asking."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
