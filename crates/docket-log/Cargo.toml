[package]
name = "docket-log"
description = "The one log setup of the daemons: a tracing subscriber that writes one line per event to standard error, which the journal keeps, with the journal's priority prefix when it is the journal that is listening."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tracing = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[lints]
workspace = true

[features]
# Span export over OTLP/HTTP JSON, written in `src/otlp` over `std` networking, `serde_json` and `url`: no
# opentelemetry, tonic, reqwest or tracing-subscriber crate. `init` reads
# `OTEL_EXPORTER_OTLP_ENDPOINT` (or `OTEL_EXPORTER_OTLP_TRACES_ENDPOINT`), `OTEL_SERVICE_NAME` and
# `OTEL_SDK_DISABLED` once (so only a daemon's `main` reads them); only `http://` endpoints are
# accepted. Off by default; without it the crate has no dependency beyond `tracing`.
otlp = ["dep:serde_json", "dep:thiserror", "dep:url"]
