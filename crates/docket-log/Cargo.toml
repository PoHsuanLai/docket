[package]
name = "docket-log"
description = "The one log setup of the daemons: installs a standard tracing subscriber from a typed config, to the journal when it listens and to standard error otherwise, with optional OpenTelemetry span export."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-journald = { workspace = true }
thiserror = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[lints]
workspace = true

[features]
# Span export over OTLP/HTTP through the OpenTelemetry crates. `init` exports only when
# `OTEL_EXPORTER_OTLP_ENDPOINT` or `OTEL_EXPORTER_OTLP_TRACES_ENDPOINT` is set and
# `OTEL_SDK_DISABLED` is not `true`; the crates read the endpoint and `OTEL_SERVICE_NAME` themselves.
# Off by default; without it the crate depends on `tracing`, `tracing-subscriber` and `tracing-journald` only.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
