[package]
name = "actions-mcp"
description = "The MCP edge: an MCP server generated from the registry's offered actions, every call through the router as Actor::Mcp with untrusted arguments. Off by default; the binary is a skeleton."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "actions_mcp"
path = "src/lib.rs"

[[bin]]
name = "actions-mcp"
path = "src/main.rs"

[dependencies]
docket-core = { workspace = true }
docket-client = { workspace = true }
prov = { workspace = true }
porter-core = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
toml = { workspace = true }
