[package]
name = "actions-mcp"
description = "The MCP edge: an MCP server generated from the registry's offered actions, every call through the router as Actor::Mcp with untrusted arguments. Off by default; the binary serves it over stdio or a Unix socket."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "actions_mcp"
path = "src/lib.rs"

[[bin]]
name = "actions-mcp"
path = "src/main.rs"

[dependencies]
docket-core = { workspace = true }
docket-client = { workspace = true, features = ["dbus"] }
docket-dbus = { workspace = true }
docket-settings = { workspace = true }
prov = { workspace = true }
porter-core = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
zbus = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
docket-testbus = { workspace = true }
intentd = { path = "../intentd" }
tempfile = { workspace = true }
docket-client = { workspace = true, features = ["in_process"] }
docket-fake = { workspace = true }
docket-router = { workspace = true }
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true }
