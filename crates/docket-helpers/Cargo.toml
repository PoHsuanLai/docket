[package]
name = "docket-helpers"
description = "The helpers' runner: the hub that owns the board of helper jobs and carries its effects out (records through the router, the sentences told, each helper's conversation, the tasks that run the jobs through a `Spawn` seam), the helper desk and the terminal hand-over it answers, and the routines' scheduler with its host, desk, systemd timer directory and zone. What is decided over values is companion-core's; companiond is the bus adapter over this."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
almanac-core = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
companion-core = { workspace = true }
companion-wire = { workspace = true }
docket-client = { workspace = true }
docket-core = { workspace = true }
docket-manifest = { workspace = true }
docket-vocab = { workspace = true }
docket-planner = { workspace = true }
docket-store = { workspace = true }
docket-tasks = { workspace = true }
futures-util = { workspace = true }
porter-core = { workspace = true }
prov = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
# `TokioSpawn`: the `Spawn` seam on the tokio runtime the caller is in.
tokio = ["dep:tokio"]

[dev-dependencies]
docket-client = { workspace = true, features = ["in_process"] }
docket-fake = { workspace = true }
docket-helpers = { workspace = true, features = ["tokio"] }
docket-permissions-core = { workspace = true }
docket-router = { workspace = true }
porter-client = { workspace = true }
porter-infer = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
