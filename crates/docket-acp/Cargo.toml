[package]
name = "docket-acp"
description = "The ACP server edge: an editor (Zed, JetBrains, Neovim) drives the companion over the Agent Client Protocol on stdio. The JSON-RPC connection is the official agent-client-protocol SDK's; this lib is the server over the SessionHost and SessionLog seams, and the capped line source both edges hand the SDK. Our own ACP rules (confinement, the permission ruling, taint, strikes, tool-request mapping, the protocol errors) are `acp-core`; an external agent as a session backend is `docket-acp-host`. The process is docket-acp-bin, which refuses to serve unless `agent.acp.expose` is on. The editor's permission prompt is an extra gate, never a replacement for ours."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "docket_acp"
path = "src/lib.rs"

[dependencies]
acp-core = { workspace = true }
agent-client-protocol = { workspace = true }
companion-wire = { workspace = true }
docket-core = { workspace = true }
docket-vocab = { workspace = true }
docket-session = { workspace = true }
docket-settings = { workspace = true }
futures-channel = { workspace = true }
futures-util = { workspace = true, features = ["sink"] }
porter-core = { workspace = true }
prov = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
docket-session = { workspace = true, features = ["testing"] }
docket-fake = { workspace = true }
docket-testbus = { workspace = true }
jsonschema = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
