[package]
name = "docket-inapp"
description = "The portable in-app agent: the router, policy point, reviewer and agent loop hosted inside one app over that app's own IntentProvider, with the app's own confirm sheet. No intentd, no bus, no daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
action-review = { workspace = true }
agent-loop = { workspace = true }
companion-wire = { workspace = true }
almanac-core = { workspace = true }
docket-client = { workspace = true, features = ["in_process"] }
docket-core = { workspace = true }
docket-planner = { workspace = true }
docket-router = { workspace = true }
policy-point = { workspace = true }
porter-client = { workspace = true }
porter-core = { workspace = true }
prov = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
cua-action = { workspace = true }
docket-fake = { workspace = true }
porter-infer = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
