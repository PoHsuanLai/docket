# A fixture manifest for the fake mail app. Every field is written.
vocab = 1
app = "org.quire.Mail"

[[entities]]
kind = "mail.thread"
label = "Thread"
plural = "Threads"
icon = "mail"
class = "mail"
index = "indexed"
# Mail subjects are written by other people.
titles = { kind = "third_party", v = { kind = "mail" } }
props = []

# The sender is decided by the message, which somebody else wrote: whatever the app says, the
# thing this names is untrusted.
[[entities.relations]]
name = "from"
label = "Sender"
to = "mail.contact"
many = "one"
trust = { kind = "third_party", v = { kind = "mail" } }

[[entities]]
kind = "mail.contact"
label = "Contact"
plural = "Contacts"
icon = "person"
class = "contacts"
index = "not_indexed"
titles = { kind = "app_authored" }
props = []

[[actions]]
name = "mail.thread.read"
label = "Read"
on = { kind = "one", v = "mail.thread" }
effect = "read"
classes = ["mail"]
undo = "not_undoable"
reach = "offered"
latency = "quick"
result = { kind = "value", v = { ty = { kind = "text", v = { max = 20000, lines = "many" } }, trust = { kind = "third_party", v = { kind = "mail" } } } }
keys = { kind = "none" }
lasting = "no"
dry_run = "none"
params = []

# The launcher performs this on a search hit: show the thread in the app's own window.
[[actions]]
name = "mail.thread.open"
label = "Open"
on = { kind = "one", v = "mail.thread" }
effect = "read"
classes = []
undo = "not_undoable"
reach = "hidden"
latency = "quick"
result = { kind = "nothing" }
keys = { kind = "none" }
lasting = "no"
dry_run = "none"
params = []

[[actions]]
name = "mail.thread.archive"
label = "Archive"
on = { kind = "many", v = "mail.thread" }
effect = "undoable_write"
classes = ["mail"]
undo = "token"
reach = "offered"
latency = "quick"
result = { kind = "nothing" }
keys = { kind = "chord", v = "E" }
lasting = "no"
dry_run = "none"
params = []

[[actions]]
name = "mail.draft.create"
label = "Create draft"
on = { kind = "nothing" }
effect = "undoable_write"
classes = ["mail"]
undo = "token"
reach = "offered"
latency = "quick"
result = { kind = "nothing" }
keys = { kind = "none" }
lasting = "no"
dry_run = "none"

[[actions.params]]
name = "body"
label = "Body"
ty = { kind = "text", v = { max = 20000, lines = "many" } }
need = { kind = "required" }
sink = "body"

[[actions]]
name = "mail.message.send"
label = "Send"
on = { kind = "nothing" }
effect = "outbound"
classes = ["mail", "contacts"]
# The app holds the send for an undo window.
undo = "token"
reach = "offered"
latency = "quick"
result = { kind = "nothing" }
keys = { kind = "none" }
lasting = "no"
dry_run = "preview"

[[actions.params]]
name = "to"
label = "To"
ty = { kind = "entity", v = "mail.contact" }
need = { kind = "required" }
sink = "recipient"

[[actions.params]]
name = "body"
label = "Message"
ty = { kind = "text", v = { max = 20000, lines = "many" } }
need = { kind = "required" }
sink = "body"

[[actions]]
name = "mail.message.forward"
label = "Forward"
on = { kind = "many", v = "mail.thread" }
effect = "outbound"
classes = ["mail", "contacts"]
undo = "not_undoable"
reach = "offered"
latency = "quick"
result = { kind = "nothing" }
keys = { kind = "none" }
lasting = "no"
dry_run = "preview"

[[actions.params]]
name = "to"
label = "To"
ty = { kind = "entity", v = "mail.contact" }
need = { kind = "required" }
sink = "recipient"

[[actions]]
name = "mail.thread.delete"
label = "Delete"
on = { kind = "many", v = "mail.thread" }
effect = "destructive"
classes = ["mail"]
undo = "not_undoable"
reach = "offered"
latency = "quick"
result = { kind = "nothing" }
keys = { kind = "none" }
lasting = "no"
dry_run = "none"
params = []
