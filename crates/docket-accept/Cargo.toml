[package]
name = "docket-accept"
description = "Test only: the first end-to-end acceptance of the agent tier. The real intentd, companiond, readerd, memoryd and inferd run as processes on a private bus (inferd replaying cassettes), beside a mail provider and a Confirm1 server, and SPEC section 5 flows (a) and (c) run through them."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# The daemons run as their own processes from these thin mains: the same daemon the packaged
# binaries run (`run_with`, given the proc root and model tap from the environment), under names that cannot collide with theirs in one target directory. memoryd's
# memoryd and inferd are not here: `build.rs` builds the packaged binaries of almanac (with its
# `test-keys` feature) and porter, from git at the revs the workspace pins.
[[bin]]
name = "accept-intentd"
path = "src/bin/accept-intentd.rs"

[[bin]]
name = "accept-companiond"
path = "src/bin/accept-companiond.rs"

[[bin]]
name = "accept-acp"
path = "src/bin/accept-acp.rs"

[[bin]]
name = "accept-docket-agent"
path = "src/bin/accept-docket-agent.rs"

[[bin]]
name = "accept-readerd"
path = "src/bin/accept-readerd.rs"

# `quire-do` itself: the packaged main, built under a name of the acceptance harness (a test of this
# package can only name this package's binaries).
[[bin]]
name = "accept-quire-do"
path = "../docket-cli/src/main.rs"

[[bin]]
name = "accept-actions-mcp"
path = "src/bin/accept-actions-mcp.rs"

[[bin]]
name = "accept-bus-relay"
path = "src/bin/accept-bus-relay.rs"

[[bin]]
name = "accept-fake-agent"
path = "src/bin/accept-fake-agent.rs"

[dependencies]
actions-mcp = { workspace = true }
companion-wire = { workspace = true }
companiond = { workspace = true }
docket-acp = { workspace = true }
docket-acp-bin = { workspace = true, features = ["testing"] }
docket-cli = { workspace = true }
docket-client = { workspace = true, features = ["dbus", "in_process"] }
docket-provider = { workspace = true, features = ["dbus"] }
docket-core = { workspace = true }
docket-manifest = { workspace = true, features = ["manifest-file"] }
docket-vocab = { workspace = true }
docket-dbus = { workspace = true, features = ["inferd", "fixture-callers"] }
docket-log = { workspace = true }
docket-trace = { workspace = true }
docket-router = { workspace = true }
docket-testbus = { workspace = true }
fnv = { workspace = true }
futures-util = { workspace = true }
intentd = { workspace = true }
readerd = { workspace = true }
almanac-core = { workspace = true }
almanac-client = { workspace = true, features = ["dbus"] }
porter-core = { workspace = true }
porter-daemon = { workspace = true }
porter-infer = { workspace = true }
prov = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }

[lints]
workspace = true
