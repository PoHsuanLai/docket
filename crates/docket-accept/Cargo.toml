[package]
name = "docket-accept"
description = "Test only: the first end-to-end acceptance of the agent tier. The real intentd, companiond, readerd, memoryd and inferd run as processes on a private bus (inferd replaying cassettes), beside a mail provider and a Confirm1 server, and SPEC section 5 flows (a) and (c) run through them."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# The daemons run as their own processes from these thin mains: the same `run()` the packaged
# binaries call, under names that cannot collide with theirs in one target directory. memoryd's
# memoryd and inferd are not here: `build.rs` builds the packaged binaries of almanac (with its
# `test-keys` feature) and porter, from git at the revs the workspace pins.
[[bin]]
name = "accept-intentd"
path = "src/bin/accept-intentd.rs"

[[bin]]
name = "accept-companiond"
path = "src/bin/accept-companiond.rs"

[[bin]]
name = "accept-acp"
path = "src/bin/accept-acp.rs"

[[bin]]
name = "accept-readerd"
path = "src/bin/accept-readerd.rs"

[[bin]]
name = "accept-quire-do"
path = "src/bin/accept-quire-do.rs"

[[bin]]
name = "accept-actions-mcp"
path = "src/bin/accept-actions-mcp.rs"

[[bin]]
name = "accept-fake-agent"
path = "src/bin/accept-fake-agent.rs"

[[bin]]
name = "docket-live"
path = "src/bin/docket-live.rs"

[dependencies]
actions-mcp = { path = "../actions-mcp" }
action-review = { workspace = true }
companion-wire = { workspace = true }
companiond = { path = "../companiond", features = ["test-proc-root"] }
docket-agents = { workspace = true }
docket-acp = { path = "../docket-acp" }
docket-acp-bin = { path = "../docket-acp-bin" }
docket-cli = { path = "../docket-cli" }
docket-client = { workspace = true, features = ["dbus"] }
docket-core = { workspace = true }
docket-dbus = { workspace = true, features = ["inferd", "test-model-trace"] }
docket-eval = { workspace = true }
docket-inapp = { workspace = true }
docket-launch = { workspace = true }
bulkhead = { workspace = true }
docket-session = { workspace = true }
docket-settings = { workspace = true, features = ["agents"] }
docket-fake = { workspace = true }
docket-router = { workspace = true }
docket-testbus = { workspace = true }
futures-util = { workspace = true }
intentd = { path = "../intentd", features = ["test-proc-root"] }
readerd = { path = "../readerd" }
almanac-core = { workspace = true }
almanac-client = { workspace = true, features = ["dbus"] }
porter-client = { workspace = true, features = ["dbus"] }
porter-core = { workspace = true }
porter-infer = { workspace = true }
prov = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
zbus = { workspace = true }

[lints]
workspace = true
