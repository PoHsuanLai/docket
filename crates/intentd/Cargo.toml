[package]
name = "intentd"
description = "The daemon: builds the router over its seams (apps over D-Bus, the sheet, inferd, memoryd, the grant file) and serves org.quire.Intents1; also hosts the built-in org.quire.Memory and org.quire.Companion providers. The binary is a skeleton."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "intentd"
path = "src/lib.rs"

[[bin]]
name = "intentd"
path = "src/main.rs"

[dependencies]
docket-core = { workspace = true }
docket-router = { workspace = true }
docket-client = { workspace = true }
docket-dbus = { workspace = true }
policy-point = { workspace = true }
action-review = { workspace = true }
prov = { workspace = true }
porter-core = { workspace = true }
porter-infer = { workspace = true }
porter-client = { workspace = true, features = ["dbus"] }
almanac-core = { workspace = true }
almanac-client = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
