[package]
name = "intentd"
description = "The daemon: builds the router over its seams (apps over D-Bus, the sheet, inferd, memoryd, the grant file) and serves org.quire.Intents1; also hosts the built-in org.quire.Memory and org.quire.Companion providers. The binary is a skeleton."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "intentd"
path = "src/lib.rs"

[[bin]]
name = "intentd"
path = "src/main.rs"

[dependencies]
porter-ids = { workspace = true }
bulkhead = { workspace = true }
companion-model = { workspace = true }
docket-checkpoint-git = { workspace = true }
docket-permissions-core = { workspace = true }
porter-dbus = { workspace = true }
porter-daemon = { workspace = true, features = ["watch"] }
docket-core = { workspace = true }
docket-wire = { workspace = true }
docket-manifest = { workspace = true, features = ["manifest-file"] }
docket-vocab = { workspace = true }
docket-store = { workspace = true }
docket-log = { workspace = true }
docket-router = { workspace = true }
docket-skills = { workspace = true }
docket-skills-disk = { workspace = true }
docket-settings = { workspace = true }
docket-client = { workspace = true, features = ["dbus"] }
docket-provider = { workspace = true }
docket-dbus = { workspace = true, features = ["inferd"] }
docket-procroot = { workspace = true }
docket-memory = { workspace = true }
docket-memory-core = { workspace = true }
docket-session = { workspace = true }
docket-models = { workspace = true }
policy-point = { workspace = true }
action-review = { workspace = true }
prov = { workspace = true }
porter-core = { workspace = true }
porter-infer = { workspace = true }
porter-client = { workspace = true, features = ["dbus"] }
almanac-client = { workspace = true, features = ["dbus"] }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
notify = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
model-provider = { workspace = true }
rust_decimal = { workspace = true }
porter-wire = { workspace = true }
porter-match = { workspace = true }
porter-capability = { workspace = true }
almanac-core = { workspace = true }
docket-acp-bin = { workspace = true }
docket-host = { workspace = true }
docket-dbus = { workspace = true, features = ["fixture-callers"] }
docket-testbus = { workspace = true }
docket-fake = { workspace = true }
porter-infer = { workspace = true, features = ["testing"] }
almanac-dbus = { workspace = true }
almanac-dbus-serve = { workspace = true }
readerd = { workspace = true }
proptest = { workspace = true }
docket-client = { workspace = true, features = ["dbus", "in_process"] }
docket-provider = { workspace = true, features = ["dbus"] }
cua-action = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
docket-gate-wire = { workspace = true }

[lints]
workspace = true

[features]
# Span export over OTLP (docket-log's `otlp`), switched on at run time by `OTEL_EXPORTER_OTLP_ENDPOINT`.
otlp = ["docket-log/otlp"]
