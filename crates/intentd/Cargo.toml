[package]
name = "intentd"
description = "The daemon: builds the router over its seams (apps over D-Bus, the sheet, inferd, memoryd, the grant file) and serves org.quire.Intents1; also hosts the built-in org.quire.Memory and org.quire.Companion providers. The binary is a skeleton."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "intentd"
path = "src/lib.rs"

[[bin]]
name = "intentd"
path = "src/main.rs"

[features]
# `INTENTD_PROC_ROOT=<dir>` makes the daemon read `<dir>/<pid>/cgroup` for its callers instead of
# `/proc/<pid>/cgroup`, so an acceptance run can present its test processes as a terminal or an
# app. TEST ONLY: off by default, never in a release or dist build (scripts/check-boundary.sh
# fails if a default build has it); without it the variable is ignored, with one stderr line.
test-proc-root = []

[dependencies]
porter-dbus = { workspace = true }
porter-daemon = { workspace = true }
docket-core = { workspace = true, features = ["atomic-file"] }
docket-router = { workspace = true }
docket-skills = { workspace = true }
docket-settings = { workspace = true }
docket-client = { workspace = true, features = ["dbus"] }
docket-dbus = { workspace = true, features = ["inferd"] }
docket-memory = { workspace = true }
docket-session = { workspace = true }
docket-models = { workspace = true }
policy-point = { workspace = true }
action-review = { workspace = true }
prov = { workspace = true }
porter-core = { workspace = true }
porter-infer = { workspace = true }
porter-client = { workspace = true, features = ["dbus"] }
almanac-core = { workspace = true }
almanac-client = { workspace = true, features = ["dbus"] }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
docket-testbus = { workspace = true }
docket-fake = { workspace = true }
porter-fake = { workspace = true }
almanac-dbus = { workspace = true }
readerd = { path = "../readerd" }
proptest = { workspace = true }
docket-client = { workspace = true, features = ["dbus", "in_process"] }
cua-action = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
