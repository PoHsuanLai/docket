[package]
name = "docket-launch"
description = "Starts the external coding agents (Claude Code, Gemini CLI) that docket-acp's client edge drives: the agents.toml config, the sandboxed process behind the Spawn seam, the model endpoint (inferd, P4) or the key handoff (P2) from porter, the login the agent runs itself, and the duties of a launcher (register, sessions, revocations, give back what was lent). The `dbus` feature adds the real accountd and inferd link."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The real porter link: accountd's launcher interface and inferd's agent endpoints over the bus.
dbus = ["dep:porter-client", "dep:porter-dbus", "dep:futures-util", "dep:serde_json", "dep:zbus"]

[lib]
name = "docket_launch"
path = "src/lib.rs"

[dependencies]
docket-acp = { workspace = true, features = ["client", "server"] }
docket-core = { workspace = true }
docket-session = { workspace = true }
docket-settings = { workspace = true }
docket-shell = { workspace = true }
futures-util = { workspace = true, optional = true }
porter-client = { workspace = true, features = ["dbus"], optional = true }
porter-core = { workspace = true }
porter-dbus = { workspace = true, optional = true }
prov = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
toml = { workspace = true }
zbus = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
