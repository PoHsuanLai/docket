[package]
name = "docket-settings"
description = "docket's settings file ($XDG_CONFIG_HOME/docket/settings.toml, design/22 section 3.27): the key table, the lenient reader that falls back per key, the schema the Settings app draws, and where the file is found. Pure but for reading the file; the watch lives in the daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
docket-agents = { workspace = true, optional = true }
docket-core = { workspace = true }
porter-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

[features]
default = ["agents"]
# The `agents.toml` rows the Settings app draws (`read_agents`, `write_agent_choice`, ...): they read
# the registry's records through docket-agents, which links an unpacker. A consumer of the
# `agent.*` keys alone turns this off.
agents = ["dep:docket-agents", "docket-core/atomic-file"]

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
