[package]
name = "docket-settings"
description = "docket's settings file ($XDG_CONFIG_HOME/docket/settings.toml, design/22 section 3.27): the key table, the lenient reader that falls back per key, the schema the Settings app draws, and where the file is found. Pure but for reading the file; the watch lives in the daemon."
