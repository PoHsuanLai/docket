[package]
name = "docket-session"
description = "The durable session, portable and pure: `SessionEntry` (the append-only log of one session), `resume_plan` (entries in, a typed plan out), `fork`, `export`, a reader for the records companiond wrote before, and the `SessionBackend`, `SessionHost` and `SessionLog` seams. No bus, no runtime, no clock read."
