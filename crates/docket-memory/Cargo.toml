[package]
name = "docket-memory"
description = "docket's memory seam over a transport, portable: `MemoryLink` and `SessionLog` over almanac-client (any Transport: memoryd over D-Bus, or the service hosted in process), `MemoryProvider` (the org.quire.Memory actions as an IntentProvider), and `AuditState`, which drains the audit queue into memory with retry accounting. No bus, no runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
almanac-client = { workspace = true }
almanac-core = { workspace = true }
docket-core = { workspace = true }
docket-manifest = { workspace = true }
docket-vocab = { workspace = true }
docket-memory-core = { workspace = true }
docket-provider = { workspace = true }
docket-session = { workspace = true }
porter-core = { workspace = true }
prov = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
docket-session = { workspace = true, features = ["testing"] }
almanac-client = { workspace = true, features = ["in_process"] }
almanac-fake = { workspace = true }
almanac-service = { workspace = true }
docket-fake = { workspace = true }
docket-router = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
