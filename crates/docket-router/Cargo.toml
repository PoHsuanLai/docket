[package]
name = "docket-router"
description = "The pure router: `Router` and the seams the daemon passes in, over docket-context (what it remembers) and docket-gate (the pure steps of a call)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-ids = { workspace = true }
companion-model = { workspace = true }
docket-checkpoint = { workspace = true }
docket-context = { workspace = true }
docket-core = { workspace = true }
docket-gate = { workspace = true }
docket-wire = { workspace = true }
docket-gate-wire = { workspace = true }
docket-manifest = { workspace = true, features = ["manifest-file"] }
docket-permissions-core = { workspace = true }
docket-vocab = { workspace = true }
docket-session = { workspace = true }
docket-skills = { workspace = true }
policy-point = { workspace = true }
action-review = { workspace = true }
prov = { workspace = true }
porter-core = { workspace = true }
almanac-core = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
bulkhead = { workspace = true }
model-provider = { workspace = true }
toml = { workspace = true }
rust_decimal = { workspace = true }
docket-session = { workspace = true, features = ["testing"] }
docket-fake = { workspace = true }
docket-provider = { workspace = true }
tokio = { workspace = true }
proptest = { workspace = true }
cua-action = { workspace = true }
