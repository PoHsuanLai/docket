[package]
name = "voiced"
description = "The voice daemon: the only process that opens the microphone, serves org.quire.Voice1, and runs the voice machines. The audio device is the voice-audio seam; the PipeWire backend is voice-pipewire."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-match = { workspace = true }
porter-capability = { workspace = true }
porter-ids = { workspace = true }
voice-loop = { workspace = true }
voice-audio = { workspace = true }
voice-wire = { workspace = true }
voice-dbus = { workspace = true }
docket-wire = { workspace = true }
porter-core = { workspace = true }
porter-infer = { workspace = true }
inferd-client = { workspace = true, features = ["dbus"] }
docket-dbus = { workspace = true }
docket-procroot = { workspace = true }
voice-pipewire = { workspace = true, optional = true }
futures-util = { workspace = true }
speech-vad = { workspace = true }
speech-provider = { workspace = true }
zbus = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
docket-log = { workspace = true }

[features]
default = ["pipewire"]
# `voice-pipewire`, the shipped audio backend (needs libpipewire and libclang to build). The
# daemon binary and the by-hand example need it; the library without it is the machines and
# `dictate`, so a test or another backend builds with `--no-default-features`.
pipewire = ["dep:voice-pipewire"]

[[bin]]
name = "voiced"
path = "src/main.rs"
required-features = ["pipewire"]

[[example]]
name = "voice_capture_try"
required-features = ["pipewire"]

[lints]
workspace = true

[dev-dependencies]
docket-vocab = { workspace = true }
docket-dbus = { workspace = true, features = ["fixture-callers"] }
docket-testbus = { workspace = true }
porter-infer = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
futures-util = { workspace = true }
