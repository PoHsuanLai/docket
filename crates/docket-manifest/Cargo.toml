[package]
name = "docket-manifest"
description = "docket's manifest: what an app declares (entities, actions, parameters), its validation (`validate`, `ValidManifest`, `fits`), a manifest file read as TOML (feature `manifest-file`) and a tool call's JSON arguments read into typed ones (`args_from_json`)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
almanac-core = { workspace = true }
docket-vocab = { workspace = true }
porter-core = { workspace = true }
prov = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true, optional = true }
url = { workspace = true }

[features]
# `manifest-file`: `parse`, a manifest file read as TOML and validated. Off by default so the pure
# crates that sit on this one never reach a TOML parser.
manifest-file = ["dep:toml"]

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
toml = { workspace = true }
