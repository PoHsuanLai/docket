[package]
name = "voice-audio"
description = "The audio device seam, pure: the node model, the capture choice (never a monitor), the capture and playback traits, and a scripted fake behind the testing feature."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures-util = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[features]
# `FakeAudioDevice`, a device that plays scripted frames, for tests.
testing = []

[dev-dependencies]
# The tests play the fake device, so they build the crate with its `testing` feature on.
voice-audio = { workspace = true, features = ["testing"] }
tokio = { workspace = true }

[lints]
workspace = true
