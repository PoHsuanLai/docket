[package]
name = "docket-core"
description = "docket's vocabulary: ids, the manifest and its validation, values, context, previews, calls, refusals, undo, confirmation, budgets, the task policy, the planner and reader contract, the roster, audit records and the wire."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
prov = { workspace = true }
almanac-core = { workspace = true }
cua-action = { workspace = true }
model-provider = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
# `write_atomic` and `read_optional` (std::fs): the one durable way to replace a file. Off, this is a
# types crate that touches no disk; the crates that keep files turn it on.
atomic-file = []

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
