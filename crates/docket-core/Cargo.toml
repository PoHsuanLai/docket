[package]
name = "docket-core"
description = "docket's vocabulary above docket-vocab and docket-manifest: context, previews, calls, refusals, undo, confirmation, budgets, the task policy, the planner and reader contract, the roster, audit records, the memory and event-log seams (`MemoryLink`, `EventSink`) and the wire. Ids, units, values and the `Clock` seam are in docket-vocab; the manifest, its validation and the JSON argument reader are in docket-manifest."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

