[package]
name = "docket-core"
description = "docket's vocabulary: ids, the manifest and its validation, values, context, previews, calls, refusals, undo, confirmation, budgets, the task policy, the planner and reader contract, the roster, audit records, the memory and event-log seams (`MemoryLink`, `EventSink`) and the wire."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bulkhead = { workspace = true }
chrono = { workspace = true }
porter-core = { workspace = true }
porter-infer = { workspace = true }
prov = { workspace = true }
almanac-core = { workspace = true }
cua-action = { workspace = true }
model-provider = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true, optional = true }
url = { workspace = true }

[features]
# `manifest-file`: `parse`, a manifest file read as TOML and validated. Off by default so the pure
# crates that sit on this one never reach a TOML parser.
manifest-file = ["dep:toml"]

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
toml = { workspace = true }
