[package]
name = "docket-native"
description = "The native durable-session backend: a docket-tasks Companion's planner loop behind docket-session's SessionBackend and SessionHost (NativeBackend, NativeHost), one cancel-safe flight per turn, sheets through a SheetDesk, fork and export over the log. The ACP edge's host in docket-acp-bin."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agent-loop = { workspace = true }
companion-wire = { workspace = true }
docket-client = { workspace = true }
docket-core = { workspace = true }
docket-planner = { workspace = true }
docket-session = { workspace = true }
docket-tasks = { workspace = true }
futures-channel = { workspace = true }
futures-util = { workspace = true }
prov = { workspace = true }

[dev-dependencies]
docket-session = { workspace = true, features = ["testing"] }
docket-client = { workspace = true, features = ["in_process"] }
docket-fake = { workspace = true }
docket-router = { workspace = true }
porter-core = { workspace = true }
porter-client = { workspace = true }
porter-infer = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
