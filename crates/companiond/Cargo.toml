[package]
name = "companiond"
description = "The companion daemon: one identity over many tasks, each its own docket session. Serves org.quire.Companion1; the binary serves it on the session bus. It runs the helper tasks, the routine timer and the bus; the decisions over values are companion-core's."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "companiond"
path = "src/lib.rs"

[[bin]]
name = "companiond"
path = "src/main.rs"

[dependencies]
almanac-core = { workspace = true }
companion-core = { workspace = true }
companion-wire = { workspace = true }
docket-core = { workspace = true }
docket-store = { workspace = true }
docket-log = { workspace = true }
docket-planner = { workspace = true }
docket-skills = { workspace = true }
docket-skills-disk = { workspace = true }
docket-tasks = { workspace = true }
docket-client = { workspace = true, features = ["dbus"] }
docket-dbus = { workspace = true, features = ["inferd"] }
docket-settings = { workspace = true }
futures-util = { workspace = true }
prov = { workspace = true }
porter-client = { workspace = true, features = ["dbus"] }
porter-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
zbus = { workspace = true }

[lints]
workspace = true

[features]
# Span export over OTLP (docket-log's `otlp`), switched on at run time by `OTEL_EXPORTER_OTLP_ENDPOINT`.
otlp = ["docket-log/otlp"]

[dev-dependencies]
docket-dbus = { workspace = true, features = ["fixture-callers"] }
agent-loop = { workspace = true }
porter-infer = { workspace = true }
docket-testbus = { workspace = true }
docket-client = { workspace = true, features = ["in_process"] }
docket-fake = { workspace = true }
docket-router = { workspace = true }
tempfile = { workspace = true }
