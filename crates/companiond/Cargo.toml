[package]
name = "companiond"
description = "The companion daemon: one identity over many tasks, each its own docket session. Serves org.quire.Companion1; the binary serves it on the session bus."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "companiond"
path = "src/lib.rs"

[[bin]]
name = "companiond"
path = "src/main.rs"

[dependencies]
agent-loop = { workspace = true }
almanac-core = { workspace = true }
companion-wire = { workspace = true }
docket-core = { workspace = true }
docket-skills = { workspace = true }
docket-client = { workspace = true, features = ["dbus"] }
docket-dbus = { workspace = true, features = ["inferd"] }
docket-settings = { workspace = true }
futures-util = { workspace = true }
prov = { workspace = true }
porter-client = { workspace = true, features = ["dbus"] }
porter-core = { workspace = true }
porter-infer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
zbus = { workspace = true }

# `COMPANIOND_PROC_ROOT=<dir>` makes the daemon read `<dir>/<pid>/cgroup` to tell a terminal from
# anything else, so an acceptance run can present a test process as one. TEST ONLY: off by
# default and never in a release or dist build (scripts/check-boundary.sh); without it the
# variable is ignored, with one stderr line.
[features]
test-proc-root = []

[lints]
workspace = true

[dev-dependencies]
docket-testbus = { workspace = true }
docket-client = { workspace = true, features = ["in_process"] }
docket-fake = { workspace = true }
docket-router = { workspace = true }
tempfile = { workspace = true }
