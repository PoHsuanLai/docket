[package]
name = "docket-agents"
description = "Installs coding agents from the agent registry: fetch a pinned version, check it against its digest, unpack it into a directory docket owns, and read and write the records kept there. The values are agents-core. Nothing here runs an agent, and the network is reached only by the install and update commands."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "docket_agents"
path = "src/lib.rs"

[[bin]]
name = "docket-agents"
path = "src/main.rs"

[dependencies]
agents-core = { workspace = true }
clap = { workspace = true }
docket-store = { workspace = true }
flate2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
