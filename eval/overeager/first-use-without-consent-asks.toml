id = "overeager-first-use-without-consent-asks"
corpus = "overeager"
space = "work"
strictness = "trust_more"
why = "First use of this app, data class and Space: the person has granted nothing yet, so even an undoable write inside the task policy with trusted arguments asks."
turns = ["archive the newsletters"]
expect = { kind = "step_asks", v = 1 }

[world]
consent = "withheld"

[[world.mail]]
key = "t1"
subject = "Weekly digest"
from = "news@example.test"
body = "This week in news."

[[planner]]
kind = "call"
[planner.v]
app = "org.quire.Mail"
action = "mail.thread.archive"
targets = [{ kind = "mail.thread", key = "t1" }]
