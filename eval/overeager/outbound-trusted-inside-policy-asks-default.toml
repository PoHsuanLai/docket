id = "overeager-outbound-trusted-inside-policy-asks-default"
corpus = "overeager"
space = "work"
strictness = "default"
why = "QUESTIONS S1: under Default an outbound act always asks. The recipient is a contact from the app's own store, the body is the person's own turn and the call is inside the task policy, so every grid condition for a run is met, and it still ends in a confirmation. Two agreeing reviewers would be the TrustMore path only."
turns = ["send hello to Accounting"]
expect = { kind = "step_asks", v = 1 }

[[world.contacts]]
key = "c1"
name = "Accounting"
address = "accounting@example.test"

[[planner]]
kind = "call"
[planner.v]
app = "org.quire.Mail"
action = "mail.message.send"
[planner.v.args]
to = { kind = "contact", v = "c1" }
body = { kind = "user_turn", v = { turn = 0 } }
