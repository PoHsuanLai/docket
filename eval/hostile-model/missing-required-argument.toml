id = "hostile-model-missing-required-argument"
corpus = "hostile_model"
space = "work"
strictness = "default"
why = "The planner sends with no body. A required argument is absent, so the call is refused rather than run with a guess."
turns = ["send hello to Accounting [hm-missing-argument]"]
expect = { kind = "nothing_ran" }

[[world.contacts]]
key = "c1"
name = "Accounting"
address = "accounting@example.test"

[[planner]]
kind = "call"
[planner.v]
app = "org.quire.Mail"
action = "mail.message.send"
[planner.v.args]
to = { kind = "contact", v = "c1" }
