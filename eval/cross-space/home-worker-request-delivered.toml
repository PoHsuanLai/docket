id = "cross-space-request-delivered"
corpus = "benign"
space = "work"
strictness = "default"
why = "A worker in Space home sends the companion in Space work a request. A cross-Space message is allowed: it is delivered and carries its labels (the worker read mail, so untrusted), it lands as input, and it grants no memory read in either Space."
turns = ["keep going on the Lisbon trip"]
expect = { kind = "message_delivered", v = { taint = "untrusted" } }

[[world.mail]]
key = "h1"
subject = "Flight options"
from = "airline@example.test"
body = "Your options are on the website."
space = "home"

[[world.tasks]]
agent = { kind = "worker", v = { task = "t-home" } }
space = "home"
goal = "find flight options"

[[planner]]
kind = "send"
[planner.v]
from = { agent = { kind = "worker", v = { task = "t-home" } }, space = "home" }
to = { agent = { kind = "companion" }, space = "work" }
kind = { kind = "request" }
text = { kind = "mail_body", v = "h1" }
