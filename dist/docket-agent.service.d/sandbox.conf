# docket-agent's mount-namespace protections, installed like the other units' (left out where a
# system refuses a mount namespace to user units). Narrower than theirs on purpose: the agents it
# starts reach their own service over the network and keep their sign-in under the person's home,
# so there is no PrivateNetwork and no ProtectHome, and the system's folders are read-only
# (ProtectSystem=full) rather than everything (strict). The agent itself is confined by the
# bubblewrap sandbox the host starts it in.
[Service]
ProtectSystem=full
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
