# docket's settings schema in the design/22 format (section 9.2). Installed to
# $XDG_DATA_DIRS/quire/settings/docket.settings.toml; `actions-mcp --write-schema <dir>` writes it
# for a local install. The values live in $XDG_CONFIG_HOME/docket/settings.toml, for example
# `[agent.mcp] expose = "on"`; the daemons read them live (crates/docket-settings). Every row is
# hands-off for an agent (no `agent = "settable"`): agent.* is never agent-settable, so the
# companion can never loosen its own limits. The main page has four rows (Assistant); the rest
# are Advanced (Limits).
app = "docket"
file = "docket/settings.toml"
version = 1

[[key]]
path = "agent.strictness"
default = "default"
label = "Asks first"
help = "Choose how often the assistant checks with you. Asks more checks more often; Asks less lets it carry on inside a task you approved once. Usual is the safe default."
section = "Assistant"
exposure = "basic"

[key.kind]
kind = "segmented"

[key.kind.v]
variants = ["ask_more", "default", "trust_more"]

[key.page]
kind = "intelligence"

[key.labels]
ask_more = "Asks more"
default = "Usual"
trust_more = "Asks less"

[[key]]
path = "agent.mcp.expose"
default = "off"
label = "Other apps"
help = "Lets other apps, such as coding agents, use the actions your apps offer. Off by default. Every action still asks before anything is sent or deleted."
section = "Assistant"
exposure = "basic"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["off", "on"]

[key.page]
kind = "intelligence"

[key.labels]
off = "Off"
on = "On"

[[key]]
path = "agent.acp.expose"
default = "off"
label = "Code editors"
help = "Lets a code editor such as Zed talk to the assistant. Off by default. The editor's own prompts add to the usual checks, never replace them."
section = "Assistant"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["off", "on"]

[key.page]
kind = "intelligence"

[key.labels]
off = "Off"
on = "On"

[[key]]
path = "agent.acp.agents"
default = "off"
label = "Coding helpers"
help = "Lets the assistant use coding agents such as Claude Code as helpers, in a sandbox. Off by default. Their sign-ins stay theirs."
section = "Assistant"
exposure = "basic"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["off", "on"]

[key.page]
kind = "intelligence"

[key.labels]
off = "Off"
on = "On"

[[key]]
path = "agent.undo.keep_h"
default = 24
label = "Undo history"
help = "How long you can take back what the assistant did."
section = "Assistant"
exposure = "basic"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 1
max = 168
unit = "hours"

[key.page]
kind = "intelligence"

[[key]]
path = "agent.review.quick_ms"
default = 300
label = "Quick check time"
help = "How long a quick check may take. If it runs out of time, it asks you."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 50
max = 10000
unit = "ms"

[key.page]
kind = "intelligence"

[[key]]
path = "agent.review.deliberate_ms"
default = 3000
label = "Careful check time"
help = "How long a careful check may take before it asks you."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 50
max = 30000
unit = "ms"

[key.page]
kind = "intelligence"

[[key]]
path = "agent.review.second_ms"
default = 3000
label = "Second check time"
help = "How long the second check may take before it asks you."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 50
max = 30000
unit = "ms"

[key.page]
kind = "intelligence"

[[key]]
path = "agent.review.shadow"
default = "off"
label = "Compare checks"
help = "Keeps a private record comparing a second way of judging each quick check. It changes nothing and never leaves this computer."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["off", "on"]

[key.page]
kind = "intelligence"

[key.labels]
off = "Off"
on = "On"

[[key]]
path = "agent.budget.calls"
default = 200
label = "Actions per task"
help = "The most actions the assistant may run in one task."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 1
max = 10000
unit = "calls"

[key.page]
kind = "intelligence"

[[key]]
path = "agent.budget.writes"
default = 100
label = "Changes per task"
help = "The most changes the assistant may make in one task."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 0
max = 10000
unit = "changes"

[key.page]
kind = "intelligence"

[[key]]
path = "agent.budget.outbound"
default = 10
label = "Sends per task"
help = "The most things the assistant may send out, such as mail, messages or posts, in one task."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 0
max = 1000
unit = "sends"

[key.page]
kind = "intelligence"

[[key]]
path = "agent.budget.destructive"
default = 5
label = "Deletions per task"
help = "The most deletions the assistant may make in one task."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 0
max = 1000
unit = "deletions"

[key.page]
kind = "intelligence"

[[key]]
path = "agent.budget.per_minute"
default = 30
label = "Actions per minute"
help = "The most actions the assistant may run in a minute."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 1
max = 600
unit = "calls"

[key.page]
kind = "intelligence"

[[key]]
path = "agent.budget.fan_out"
default = 50
label = "Items per action"
help = "The most items one action may touch."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 1
max = 10000
unit = "items"

[key.page]
kind = "intelligence"

[[key]]
path = "agent.budget.chain"
default = 4
label = "Follow-up depth"
help = "How many actions one action may start in turn."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 1
max = 16
unit = "levels"

[key.page]
kind = "intelligence"

[[key]]
path = "agent.budget.wall_s"
default = 1800
label = "Task length"
help = "How long one task may run before it stops."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 60
max = 86400
unit = "s"

[key.page]
kind = "intelligence"

[[key]]
path = "agent.budget.reviews"
default = 300
label = "Checks per task"
help = "The most checks one task may use."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 1
max = 10000
unit = "reviews"

[key.page]
kind = "intelligence"

[[key]]
path = "agent.budget.denials_in_a_row"
default = 3
label = "Refusals before a pause"
help = "After this many refusals in a row, the task pauses and waits for you."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 1
max = 20
unit = "refusals"

[key.page]
kind = "intelligence"

[[key]]
path = "agent.budget.spend_microusd"
default = 0
label = "Spending per task"
help = "The most a task may spend on paid models, in millionths of a dollar. 0 keeps it on this computer."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 0
max = 1000000000
unit = "micro-USD"

[key.page]
kind = "intelligence"

[[key]]
path = "agent.task_policy.max_min"
default = 60
label = "Approval length"
help = "An approval lasts until its task ends, and no longer than this."
section = "Limits"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 1
max = 480
unit = "min"

[key.page]
kind = "intelligence"
