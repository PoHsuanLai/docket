[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["off", "on"]

[key.page]
kind = "intelligence"

[key.labels]
off = "Off"
on = "On"

[[key]]
path = "agent.acp.agents"
default = "off"
label = "Coding Agents"
help = "Lets the assistant use coding agents such as Claude Code as helpers, in a sandbox. Off by default. Their sign-ins stay theirs."
section = "Assistant"
exposure = "basic"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["off", "on"]

[key.page]
kind = "intelligence"

[key.labels]
off = "Off"
on = "On"

[[key]]
path = "agent.undo.keep_h"
default = 24
label = "Undo history"
help = "How long you can take back what the assistant did."
section = "Assistant"
