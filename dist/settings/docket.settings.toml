[[key]]
path = "agent.mcp.expose"
default = "off"
label = "Other apps"
help = "Lets other apps, such as coding agents, use the actions your apps offer. Off by default. Every action still asks before anything is sent or deleted."
section = "Assistant"
exposure = "basic"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["off", "on"]

[key.page]
kind = "intelligence"

[key.labels]
off = "Off"
on = "On"

[[key]]
path = "agent.acp.expose"
default = "off"
label = "Code editors"
help = "Lets a code editor such as Zed talk to the assistant. Off by default. The editor's own prompts add to the usual checks, never replace them."
