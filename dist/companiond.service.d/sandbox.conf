# companiond's mount-namespace protections.
# Why this is a separate file: each setting below gives the daemon a private view of the file
# system, the network, the devices or the kernel. In a user manager (systemd --user) that needs an
# unprivileged user namespace, and some systems refuse it: Ubuntu 24.04 and later turn it off for
# programs without an AppArmor profile, and the unit then fails to start with 226/NAMESPACE. The
# installer (scripts/install.sh) tests for that and installs this file only where it works. What
# needs no namespace (the system-call filter, no new privileges, no capabilities, the address
# families) stays in the unit.
[Service]
# Only Unix sockets: the session bus. A planner that read an injection still cannot reach out.
PrivateNetwork=yes
# The person's files are out of reach: the companion reads them only through apps' typed actions.
ProtectHome=yes
ProtectSystem=strict
ReadWritePaths=
PrivateTmp=yes
PrivateDevices=yes
# No kernel, module or debug surfaces.
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
