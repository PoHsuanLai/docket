# voiced's mount-namespace protections.
# Why this is a separate file: each setting below gives the daemon a private view of the file
# system, the network, the devices or the kernel. In a user manager (systemd --user) that needs an
# unprivileged user namespace, and some systems refuse it: Ubuntu 24.04 and later turn it off for
# programs without an AppArmor profile, and the unit then fails to start with 226/NAMESPACE. The
# installer (scripts/install.sh) tests for that and installs this file only where it works. What
# needs no namespace (the system-call filter, no new privileges, no capabilities, the address
# families) stays in the unit.
[Service]
# Nothing can reach the network, so a compromised voiced cannot send audio out. (The PipeWire
# native protocol is a Unix socket, so this does not cut it off.)
PrivateNetwork=yes
# The person's files are out of reach: voiced never writes them and records no audio. /home, /root
# and /run/user are empty tmpfs; only three paths are bound back in, read-only: the session bus
# and the PipeWire socket (a socket connects through a read-only bind) and sill's settings
# directory, where `voice.consent` says whether the mic may open at all.
ProtectHome=tmpfs
BindReadOnlyPaths=%t/bus
BindReadOnlyPaths=%t/pipewire-0
BindReadOnlyPaths=-%h/.config/sill
# The whole file system is read-only; nothing is writable (audio is never stored).
ProtectSystem=strict
ReadWritePaths=
PrivateTmp=yes
# No kernel, module or debug surfaces.
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
