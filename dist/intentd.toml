# intentd's configuration as the package ships it: $XDG_CONFIG_HOME/quire/intentd.toml (or
# /etc/xdg/quire/intentd.toml) replaces it whole. Which bus names play which role: the name is a
# well-known name the connection owns, or the app a nameless connection's cgroup scope names.
# `org.quire.Do` is owned by no process: a nameless connection in a terminal's scope (vte-spawn-*,
# tmux-spawn-*, a login session-*) is named `org.quire.Do` and plays `cli`. A terminal that runs in
# an app scope (konsole's `app-org.kde.konsole-<n>.scope`) is named after the app: list it under
# `cli` to let its children use quire-do. sill owns org.quire.Shell (and
# org.quire.Confirm1) and is the launcher, the only Confirm1 server intentd trusts, and the
# control centre. No reviewer models are named here: until the person chooses a set, a call that
# would be reviewed asks instead.
[roles]
launcher = ["org.quire.Shell"]
cli = ["org.quire.Do"]
companion = ["org.quire.Companion1", "org.quire.Acp"]
# docket-acp (an editor drives the companion over ACP; off unless agent.acp.expose = "on") opens
# sessions and records the editor's turns as an editor, and its planner calls as the companion.
editor = ["org.quire.Acp"]
# docket-agent (the host of an external coding agent; off unless agent.acp.agents = "on") opens the
# agent's session, records the person's prompts and makes the agent's file, command and permission
# calls, each ruled like any agent's.
acp_agent = ["org.quire.AcpAgent"]
reader = ["org.quire.Reader1"]
cua = ["org.quire.Cua1"]
mcp = ["org.quire.ActionsMcp"]
confirm = ["org.quire.Shell"]
control = ["org.quire.Shell"]

[agent]
strictness = "default"
mass_at = 20
confirm_expiry = 120
confirm_proceed = 10000
task_policy_max = 3600
undo_keep = 86400

[agent.budget]
calls = 200
writes = 100
outbound = 10
destructive = 5
per_minute = 30
fan_out = 50
chain = 4
wall = 1800
reviews = 300
spend = 0

[agent.breaker]
consecutive = 3
recent = 10
window = 50
probing = 3

[agent.review]
quick = 300
deliberate = 3000
second = 3000

[agent.assembler]
rules = 2500
profile = 1200
roster = 400
episodes = 1200
recall = 1500
context = 1000
task = 3000
full_steps = 3

[agent.idle]
idle_after = 30
side_close = 120
