# The MCP edge's configuration as the package ships it: $XDG_CONFIG_HOME/quire/actions-mcp.toml (or
# /etc/xdg/quire/actions-mcp.toml) replaces it whole. Whether the edge is on is not here: it is the
# setting `agent.mcp.expose` (Intelligence > Privacy), in $XDG_CONFIG_HOME/docket/settings.toml as
# `[agent.mcp] expose = "on"`. Off by default (QUESTIONS S7): an edge that is off lists no tools
# and refuses every call. `client` is the name this process's calls are labelled with (the person
# sees it on a confirmation); `--client NAME` on the command line wins.
client = "mcp-client"
