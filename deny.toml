# cargo-deny supply-chain gate. Run: cargo deny check licenses advisories bans sources
#
# A dependency whose licence is not listed fails the gate rather than being noticed later by
# someone reading Cargo.lock. So does a known advisory or yanked release, a wildcard version
# requirement, and a dependency from anywhere but crates.io or the owner's GitHub organisation.

[graph]
targets = ["x86_64-unknown-linux-gnu"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    # Weak, file-level copyleft. The note below says why this one is here and GPL is not.
    "MPL-2.0",
]
confidence-threshold = 0.9

# MPL-2.0 is allowed, and it is a decision rather than an oversight.
#
# MPL is file-level copyleft: fine to link or depend on, never to paste source from. That
# position is about the *licence*, so encoding it per-crate would be busywork. Several crates
# arrive under it by unrelated routes (stylo, app_units, cssparser and selectors in blitz; option-ext
# through dirs; freedesktop-desktop-entry in the shell), and the
# versions churn.
#
# Depending on them obliges us to make *those files'* source available, which their registries
# already do, and obliges nothing of ours. The rule that actually constrains these repositories,
# do not copy MPL source into them, is not something a dependency gate can check; it lives in
# CONVENTIONS.md where it can be read by the person about to break it.
#
# What stays out of that list is strong copyleft: GPL, AGPL, EUPL. Those would change what this
# project may be distributed as, and a dependency arriving under one should stop the build.

[advisories]
# Fails on a RUSTSEC vulnerability, unsound crate or yanked release. An unmaintained crate fails
# only when a workspace member depends on it directly. An advisory that has no fix yet is
# ignored by id here, with the reason beside it, never by turning the check off.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[bans]
# Two versions of one crate are common in a graph this size and are reported, not failed.
multiple-versions = "warn"
# `*` accepts any release. Path dependencies between our own private crates carry no version.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io is the only registry, and the only git host is the owner's GitHub organisation
# (porter, almanac, stoker, bulkhead, quire, chordkit). A new git source is a decision made here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["PoHsuanLai"]
