[workspace]
resolver = "3"
members = [
  "crates/docket-core",
  "crates/docket-store",
  "crates/docket-skills",
  "crates/docket-skills-disk",
  "crates/policy-point",
  "crates/action-review",
  "crates/docket-router",
  "crates/companion-core",
  "crates/companion-wire",
  "crates/companion-client",
  "crates/agent-loop",
  "crates/docket-planner",
  "crates/docket-helpers",
  "crates/docket-tasks",
  "crates/docket-native",
  "crates/docket-session",
  "crates/docket-checkpoint",
  "crates/docket-checkpoint-git",
  "crates/acp-core",
  "crates/docket-acp",
  "crates/docket-acp-host",
  "crates/docket-launch",
  "crates/agents-core",
  "crates/docket-agents",
  "crates/docket-acp-bin",
  "crates/docket-models",
  "crates/docket-reader",
  "crates/docket-memory-core",
  "crates/docket-memory",
  "crates/docket-host",
  "crates/docket-inapp",
  "crates/docket-dbus",
  "crates/docket-client",
  "crates/docket-provider",
  "crates/docket-fake",
  "crates/docket-testbus",
  "crates/docket-trace",
  "crates/docket-accept",
  "crates/docket-live",
  "crates/docket-eval",
  "crates/eval-core",
  "crates/docket-cli",
  "crates/actions-tools",
  "crates/actions-mcp",
  "crates/docket-settings",
  "crates/intentd",
  "crates/companiond",
  "crates/readerd",
  "crates/docket-ds",
  "crates/voice-wire",
  "crates/voice-audio",
  "crates/voice-pipewire",
  "crates/voice-dbus",
  "crates/voice-loop",
  "crates/voiced",
  "crates/docket-log",
  "crates/docket-procroot",
]
# cargo-fuzz needs nightly and stays out of the workspace and the gate (dev/fuzz.sh).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What quire declares; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/docket"
publish = false

[workspace.dependencies]
actions-tools  = { path = "crates/actions-tools" }
actions-mcp    = { path = "crates/actions-mcp" }
companiond     = { path = "crates/companiond" }
intentd        = { path = "crates/intentd" }
readerd        = { path = "crates/readerd" }
agents-core    = { path = "crates/agents-core" }
docket-agents  = { path = "crates/docket-agents" }
docket-core    = { path = "crates/docket-core" }
docket-store   = { path = "crates/docket-store" }
docket-skills  = { path = "crates/docket-skills" }
docket-skills-disk = { path = "crates/docket-skills-disk" }
policy-point   = { path = "crates/policy-point" }
action-review  = { path = "crates/action-review" }
docket-router  = { path = "crates/docket-router" }
companion-core = { path = "crates/companion-core" }
companion-wire = { path = "crates/companion-wire" }
companion-client = { path = "crates/companion-client" }
agent-loop     = { path = "crates/agent-loop" }
docket-planner = { path = "crates/docket-planner" }
docket-helpers = { path = "crates/docket-helpers" }
docket-tasks   = { path = "crates/docket-tasks" }
docket-native  = { path = "crates/docket-native" }
docket-session = { path = "crates/docket-session" }
docket-checkpoint = { path = "crates/docket-checkpoint" }
docket-checkpoint-git = { path = "crates/docket-checkpoint-git" }
acp-core       = { path = "crates/acp-core" }
docket-acp     = { path = "crates/docket-acp" }
docket-acp-host = { path = "crates/docket-acp-host" }
docket-launch  = { path = "crates/docket-launch" }
docket-acp-bin = { path = "crates/docket-acp-bin" }
docket-models  = { path = "crates/docket-models" }
docket-reader  = { path = "crates/docket-reader" }
docket-memory-core = { path = "crates/docket-memory-core" }
docket-memory  = { path = "crates/docket-memory" }
docket-host    = { path = "crates/docket-host" }
docket-inapp   = { path = "crates/docket-inapp" }
docket-dbus    = { path = "crates/docket-dbus" }
docket-client  = { path = "crates/docket-client", default-features = false }
docket-provider = { path = "crates/docket-provider" }
docket-fake    = { path = "crates/docket-fake" }
docket-testbus = { path = "crates/docket-testbus" }
docket-trace   = { path = "crates/docket-trace" }
docket-accept  = { path = "crates/docket-accept" }
docket-eval    = { path = "crates/docket-eval" }
eval-core      = { path = "crates/eval-core" }
docket-cli     = { path = "crates/docket-cli" }
docket-settings = { path = "crates/docket-settings" }
notify = "8.2"
docket-ds      = { path = "crates/docket-ds" }
voice-wire     = { path = "crates/voice-wire" }
voice-dbus     = { path = "crates/voice-dbus" }
voice-loop     = { path = "crates/voice-loop" }
voice-audio    = { path = "crates/voice-audio" }
voice-pipewire = { path = "crates/voice-pipewire" }
docket-log     = { path = "crates/docket-log" }
docket-procroot = { path = "crates/docket-procroot" }
# The events the daemons log (already in the build through zbus and tokio); docket-log is the subscriber.
tracing = "0.1"

# porter's frozen interfaces, by git at a pinned rev (quire CONSUMING.md section 1; a local checkout
# overrides it through a [patch], FINDINGS.md "Cross-repo dependencies"). porter has no docket dependency, so there is
# no cycle.
porter-core     = { git = "https://github.com/PoHsuanLai/porter", rev = "fc6b55aba646377c296f5ccf0e086b83e3c139ae" }
prov            = { git = "https://github.com/PoHsuanLai/prov", rev = "44dc456c04bc4d414e03385b17be2cf6ddab0436" }
# The confined shell and agent sandbox (bubblewrap as a separate process).
bulkhead        = { git = "https://github.com/PoHsuanLai/bulkhead", rev = "fe1087903357e7cb99152caa5ef8e9dff4e1be7f" }
porter-infer    = { git = "https://github.com/PoHsuanLai/porter", rev = "fc6b55aba646377c296f5ccf0e086b83e3c139ae" }
porter-client   = { git = "https://github.com/PoHsuanLai/porter", rev = "fc6b55aba646377c296f5ccf0e086b83e3c139ae", features = ["infer"] }
porter-dbus     = { git = "https://github.com/PoHsuanLai/porter", rev = "fc6b55aba646377c296f5ccf0e086b83e3c139ae" }
porter-daemon   = { git = "https://github.com/PoHsuanLai/porter", rev = "fc6b55aba646377c296f5ccf0e086b83e3c139ae" }

# almanac's frozen interfaces, by git at a pinned rev. docket-core names almanac-core's pure types
# (episodes, recall and recent shapes); intentd reaches memoryd through almanac-client.
almanac-core    = { git = "https://github.com/PoHsuanLai/almanac", rev = "39121d44877615ae3d956b6939f485f848f9306c" }
# Without its default desktop switch (`quire-desktop`, which pulls the bus): the portable crates name
# no feature, the daemons name `dbus`.
almanac-client  = { git = "https://github.com/PoHsuanLai/almanac", rev = "39121d44877615ae3d956b6939f485f848f9306c", default-features = false }
# Test-only: a MemoryService over in-memory seams, the backend of the in-process memory tests.
almanac-fake    = { git = "https://github.com/PoHsuanLai/almanac", rev = "39121d44877615ae3d956b6939f485f848f9306c" }
almanac-service = { git = "https://github.com/PoHsuanLai/almanac", rev = "39121d44877615ae3d956b6939f485f848f9306c" }
# Test-only: the fake memoryd of intentd's audit tests serves the real wire (dev-dependency).
almanac-dbus    = { git = "https://github.com/PoHsuanLai/almanac", rev = "39121d44877615ae3d956b6939f485f848f9306c" }

# stoker's pure vocabulary, by git at a pinned rev: the computer-use actions (`CuaAsk`), the structured
# output shapes (`ValueSchema` renders through `Shape`) and the speech VAD helpers.
cua-action      = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
model-provider  = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
# The OpenTelemetry GenAI names (no dependencies; no content attribute exists in it): the router's spans.
genai-names     = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
speech-vad      = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
speech-provider = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }

# quire's view-only context seams, for `docket-ds` alone (by git at a pinned rev).
ds-intents      = { git = "https://github.com/PoHsuanLai/quire.git", rev = "d17e19da64c8845d8eb413784b2d84f177a86767" }

# From quire's pinned block (`docs/workspace-deps.toml`), copied verbatim: only the lines docket
# names itself.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
thiserror = "2"
# Dates: RFC 3339 reading and the calendar. No `clock` here; only the crate that reads the local zone turns it on.
chrono = { version = "0.4", default-features = false, features = ["std"] }
url = "2.5"  # WHATWG URL parsing: the one reader of every URL docket checks
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }  # shell repos only; they also enable ds-settings/tokio. quire itself builds zbus with its async-io default so app consumers keep their own executor.
toml = "1"
toml_edit = "0.25"  # docket-settings only: agents.toml is edited in place, comments kept
# voice-pipewire's audio device (spike V-A): MIT, safe wrapper over libpipewire; needs libclang to build.
pipewire = "0.10"
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Command lines: `derive` for the structs; `help`, `usage` and `error-context` for the messages. No colour, no suggestions.
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
# Policy point: cedar-policy's lalrpop tree passes `cargo deny check licenses` (spike S-Cedar).
cedar-policy = "4.13"
# actions-mcp: pin the minor.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
# docket-acp: the official ACP SDK (Apache-2.0): the wire types, JSON-RPC framing, request matching and
# dispatch for the server edge and the client edge. It pins its schema crate (1.12.0), which is used
# through `agent_client_protocol::schema`. No `process` (agents are spawned under bulkhead) and no
# `stdio` (our capped line source).
agent-client-protocol = { version = "3.5", default-features = false }
# Dev-dependencies.
proptest = "1"
# docket-acp tests: validate our messages against the protocol-v1 JSON Schema kept in the repo (MIT).
jsonschema = { version = "0.58", default-features = false }
tempfile = "3"
# docket-store: the durable file write (BSD-3-Clause): temporary file, fsync, rename, directory fsync.
atomic-write-file = "0.3"
# agents-core: the SHA-256 of an archive; docket-agents: unpack an agent from the registry (MIT/Apache-2.0 each).
sha2 = "0.11"
# Lower-case hex of a digest or a token (agents-core, docket-checkpoint, docket-acp-host); MIT OR Apache-2.0.
const-hex = "1.19"
# docket-launch and docket-accept: FNV-1a 64 of a name (Apache-2.0 OR MIT).
fnv = "1"
# docket-acp-host: the session token's random bytes from the kernel (MIT OR Apache-2.0).
getrandom = { version = "0.3", features = ["std"] }
# docket-checkpoint-git: the escaped session segment of a ref (MIT OR Apache-2.0).
percent-encoding = "2.3"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
