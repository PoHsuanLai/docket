# The built-in `org.quire.Companion` provider, served by intentd: how the companion starts a
# worker task and talks to another agent. Starting a task is a read: the child task runs in its
# own session under a task policy never wider than its parent's, and every call it makes is
# gated on its own. A message grants nothing (see docket-core's `message` module).
vocab = 1
app = "org.quire.Companion"

[[entities]]
kind = "companion.task"
label = "Task"
plural = "Tasks"
icon = "task"
class = "app_own"
index = "not_indexed"
titles = { kind = "app_authored" }
props = []

[[actions]]
name = "companion.task.start"
label = "Start a task"
on = { kind = "nothing" }
effect = "read"
classes = ["app_own"]
undo = "not_undoable"
reach = "offered"
latency = "quick"
result = { kind = "value", v = { ty = { kind = "text", v = { max = 64, lines = "one" } }, trust = { kind = "app_authored" } } }
keys = { kind = "none" }
lasting = "no"
dry_run = "none"

[[actions.params]]
name = "goal"
label = "What to do"
ty = { kind = "text", v = { max = 2000, lines = "many" } }
need = { kind = "required" }
sink = "body"

[[actions.params]]
name = "kind"
label = "Kind of task"
ty = { kind = "choice", v = [
  { id = "research", label = "Research" },
  { id = "watch", label = "Watch" },
  { id = "background", label = "Background" },
] }
need = { kind = "defaulted", v = { kind = "choice", v = "research" } }
sink = "inert"

[[actions]]
name = "companion.task.message"
label = "Message a task"
on = { kind = "one", v = "companion.task" }
effect = "read"
classes = ["app_own"]
undo = "not_undoable"
reach = "offered"
latency = "instant"
result = { kind = "nothing" }
keys = { kind = "none" }
lasting = "no"
dry_run = "none"

[[actions.params]]
name = "text"
label = "Message"
ty = { kind = "text", v = { max = 2000, lines = "many" } }
need = { kind = "required" }
sink = "body"

# Loads an installed skill: its body comes back as trusted text for the rest of the task. A skill
# only teaches; it adds no grant and removes no check. At most three per task.
[[actions]]
name = "companion.skill.load"
label = "Load a skill"
on = { kind = "nothing" }
effect = "read"
classes = ["app_own"]
undo = "not_undoable"
reach = "offered"
latency = "instant"
result = { kind = "value", v = { ty = { kind = "text", v = { max = 8192, lines = "many" } }, trust = { kind = "app_authored" } } }
keys = { kind = "none" }
lasting = "no"
dry_run = "none"

[[actions.params]]
name = "id"
label = "Skill"
ty = { kind = "text", v = { max = 48, lines = "one" } }
need = { kind = "required" }
sink = "inert"

# Makes the person's word stricter: from now on the assistant's calls in this scope ask first, or
# are refused. It can only tighten (the two levels below are the only ones the router reads, there
# is no way to allow anything), so it needs no question. Removing what it adds is the person's act
# alone, in Settings or from the sheet's Undo; the assistant has no action for it.
[[actions]]
name = "companion.limit.add"
label = "Ask first, or never"
on = { kind = "nothing" }
effect = "read"
classes = ["app_own"]
undo = "not_undoable"
reach = "offered"
latency = "instant"
result = { kind = "nothing" }
keys = { kind = "none" }
lasting = "no"
dry_run = "none"

[[actions.params]]
name = "level"
label = "Ask first, or never"
ty = { kind = "choice", v = [
  { id = "ask", label = "Ask me first" },
  { id = "never", label = "Never" },
] }
need = { kind = "required" }
sink = "inert"

[[actions.params]]
name = "app"
label = "Which app (leave out for every app)"
ty = { kind = "text", v = { max = 128, lines = "one" } }
need = { kind = "optional" }
sink = "inert"

[[actions.params]]
name = "action"
label = "Which action of that app"
ty = { kind = "text", v = { max = 128, lines = "one" } }
need = { kind = "optional" }
sink = "inert"

[[actions.params]]
name = "reach"
label = "What it covers"
ty = { kind = "choice", v = [
  { id = "changes", label = "Anything that changes things" },
  { id = "removals", label = "Removing things only" },
  { id = "anything", label = "Everything, even looking" },
] }
need = { kind = "defaulted", v = { kind = "choice", v = "changes" } }
sink = "inert"

[[actions.params]]
name = "space"
label = "Where"
ty = { kind = "choice", v = [
  { id = "here", label = "In this Space" },
  { id = "everywhere", label = "In every Space" },
] }
need = { kind = "defaulted", v = { kind = "choice", v = "here" } }
sink = "inert"

[[actions.params]]
name = "said"
label = "The person's own words"
ty = { kind = "text", v = { max = 160, lines = "one" } }
need = { kind = "optional" }
sink = "inert"
